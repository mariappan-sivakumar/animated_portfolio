<header class="fixed top-0 w-full z-50 glass-nav border-b border-primary/10 shadow-[0_0_32px_rgba(45,212,191,0.06)]">
  <div class="flex justify-between items-center w-full px-8 h-20 max-w-screen-2xl mx-auto">

    <!-- Logo -->
    <a href="#about"
       class="text-xl font-bold tracking-[-0.02em] text-primary font-headline cursor-pointer hover:scale-105 transition-transform duration-300">
      MARIAPPAN. S
    </a>

    <!-- Desktop nav -->
    <nav class="hidden md:flex gap-8 items-center">
      <a href="#about"
         class="text-primary font-bold border-b-2 border-primary pb-1 font-headline tracking-tight hover:text-primary transition-all">
        About
      </a>
      <a href="#experience"
         class="text-on-surface opacity-70 hover:opacity-100 hover:text-primary transition-all font-headline tracking-tight">
        Experience
      </a>
      <a href="#skills"
         class="text-on-surface opacity-70 hover:opacity-100 hover:text-primary transition-all font-headline tracking-tight">
        Skills
      </a>
      <a href="#projects"
         class="text-on-surface opacity-70 hover:opacity-100 hover:text-primary transition-all font-headline tracking-tight">
        Projects
      </a>
      <a href="#contact"
         class="text-on-surface opacity-70 hover:opacity-100 hover:text-primary transition-all font-headline tracking-tight">
        Contact
      </a>
      <a href="https://catalog-education.oracle.com/ords/certview/sharebadge?id=F0E02BB70147334D3AAF1D948F7EBA600C8AD5C1076DB03CC3BA36BF77E62B68"
         target="_blank" rel="noopener noreferrer"
         class="ml-4 px-6 py-2 bg-gradient-to-r from-primary to-emerald-600 text-on-primary font-semibold rounded-lg
                hover:shadow-[0_0_20px_rgba(45,212,191,0.3)] transition-all transform hover:-translate-y-0.5 active:translate-y-0">
        Resume
      </a>
    </nav>

    <!-- Mobile hamburger -->
    <button id="mobile-menu-btn"
            class="md:hidden text-primary focus:outline-none"
            (click)="toggleMobile()"
            [attr.aria-expanded]="mobileOpen()">
      <span class="material-symbols-outlined">{{ mobileOpen() ? 'close' : 'menu' }}</span>
    </button>
  </div>

  <!-- Mobile dropdown -->
  @if (mobileOpen()) {
    <nav class="md:hidden px-8 pb-6 flex flex-col gap-4 bg-surface-container-low/95 backdrop-blur-md border-t border-primary/10">
      <a href="#about"    (click)="closeMobile()" class="text-primary font-headline font-bold py-2 border-b border-primary/10">About</a>
      <a href="#experience" (click)="closeMobile()" class="text-on-surface font-headline py-2 border-b border-primary/10 hover:text-primary transition-colors">Experience</a>
      <a href="#skills"   (click)="closeMobile()" class="text-on-surface font-headline py-2 border-b border-primary/10 hover:text-primary transition-colors">Skills</a>
      <a href="#projects" (click)="closeMobile()" class="text-on-surface font-headline py-2 border-b border-primary/10 hover:text-primary transition-colors">Projects</a>
      <a href="#contact"  (click)="closeMobile()" class="text-on-surface font-headline py-2 border-b border-primary/10 hover:text-primary transition-colors">Contact</a>
      <a href="https://catalog-education.oracle.com/ords/certview/sharebadge?id=F0E02BB70147334D3AAF1D948F7EBA600C8AD5C1076DB03CC3BA36BF77E62B68"
         target="_blank" rel="noopener noreferrer"
         (click)="closeMobile()"
         class="mt-2 px-6 py-3 bg-gradient-to-r from-primary to-emerald-600 text-on-primary font-semibold rounded-lg text-center">
        Resume
      </a>
    </nav>
  }
</header>
